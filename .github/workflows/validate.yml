name: Validate marketplace + plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The sync-versions job compares this repo against the SDK repository, which
  # is the side that moves (a release most weeks); this repo can sit still for
  # months. Without a time trigger the check cannot observe the drift it exists
  # to catch.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate sceneview plugin manifest
        run: claude plugin validate plugins/sceneview

      - name: Validate sceneview-contrib plugin manifest
        run: claude plugin validate plugins/sceneview-contrib

  sync-versions:
    name: Plugin version ↔ SDK release, skills ↔ SDK agents/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run sync-plugin-versions.sh
        run: bash scripts/sync-plugin-versions.sh
        # Exit code 1 if the plugin version drifts from the SDK's VERSION_NAME or a skill drifts from agents/.
        # When this fails, run `bash scripts/sync-plugin-versions.sh --fix` locally,
        # commit the bumped plugin.json + marketplace.json, and push.
